<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>متاهة الكنوز</title>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060a12;
  --panel: #0d1525;
  --border: #1e3a5f;
  --gold: #f5c842;
  --gold2: #e8a800;
  --cyan: #00d4ff;
  --green: #00ff88;
  --red: #ff3366;
  --text: #c8dff5;
  --muted: #4a6a8a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Cairo',sans-serif;
  overflow:hidden;
  touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* ── ANIMATED BG ── */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, #0a1e3a44 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%, #001a2e55 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
}

/* ── SCREENS ── */
.screen{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  width:100%;height:100%;gap:16px;padding:20px;
  position:relative;z-index:1;
}
.screen.active{display:flex;}

/* ── TYPOGRAPHY ── */
.game-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(18px,5vw,34px);
  font-weight:900;
  color:var(--gold);
  letter-spacing:4px;
  text-align:center;
  position:relative;
  text-shadow:0 0 40px #f5c84288, 0 0 80px #f5c84222;
}
.game-title::after{
  content:attr(data-text);
  position:absolute;inset:0;
  color:transparent;
  background:linear-gradient(135deg,var(--gold),var(--cyan),var(--gold));
  -webkit-background-clip:text;background-clip:text;
  opacity:0.15;
}
h2{
  font-family:'Orbitron',monospace;
  color:var(--cyan);font-size:clamp(13px,3vw,20px);
  letter-spacing:2px;text-align:center;
  text-shadow:0 0 20px var(--cyan);
}

/* ── CARD ── */
.card{
  background:linear-gradient(145deg,#0d1525,#091020);
  border:1px solid var(--border);
  border-radius:12px;
  padding:22px 26px;
  display:flex;flex-direction:column;gap:14px;
  width:min(420px,95vw);
  box-shadow:0 0 40px #00d4ff0a, inset 0 1px 0 #1e3a5f88;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan)33,var(--gold)33,transparent);
}

label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;letter-spacing:0.5px;}
input,select{
  background:#060a1299;
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 14px;border-radius:6px;
  font-family:'Cairo',sans-serif;font-size:14px;
  outline:none;width:100%;
  transition:border-color 0.2s,box-shadow 0.2s;
}
input:focus,select:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 2px #00d4ff15;
}
select option{background:#0d1525;}

.row{display:flex;gap:10px;}
.row label{flex:1;}

/* ── BUTTONS ── */
.btn{
  background:linear-gradient(135deg,#0d2a4a,#0a1e36);
  color:var(--cyan);
  border:1px solid var(--cyan)44;
  padding:12px 24px;
  font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;border-radius:8px;letter-spacing:1px;
  transition:all 0.15s;width:100%;
  position:relative;overflow:hidden;
  text-shadow:0 0 10px var(--cyan)88;
  box-shadow:0 0 20px #00d4ff0a;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--cyan)00,var(--cyan)08,var(--cyan)00);
  opacity:0;transition:opacity 0.2s;
}
.btn:hover{
  border-color:var(--cyan)99;
  box-shadow:0 0 30px #00d4ff22;
  transform:translateY(-1px);
}
.btn:hover::before{opacity:1;}
.btn:active{transform:translateY(1px);}

.btn.gold{
  background:linear-gradient(135deg,#2a1a00,#1a1000);
  color:var(--gold);border-color:var(--gold)44;
  text-shadow:0 0 10px var(--gold)88;
  box-shadow:0 0 20px #f5c8420a;
}
.btn.gold:hover{border-color:var(--gold)99;box-shadow:0 0 30px #f5c84222;}

.btn.secondary{
  background:#0d152511;color:var(--muted);
  border-color:#1e3a5f55;text-shadow:none;box-shadow:none;
}
.btn.secondary:hover{color:var(--text);border-color:var(--border);}
.btn.danger{background:#1a0a0e;color:var(--red);border-color:#ff336622;}

.divider{
  text-align:center;color:var(--muted);font-size:11px;
  position:relative;letter-spacing:2px;
}
.divider::before,.divider::after{
  content:'';position:absolute;top:50%;width:40%;height:1px;
  background:linear-gradient(90deg,transparent,var(--border));
}
.divider::before{left:0;}
.divider::after{right:0;transform:scaleX(-1);}

/* ── LOBBY ── */
#lobbyPlayers{width:100%;display:flex;flex-direction:column;gap:6px;}
.player-row{
  display:flex;justify-content:space-between;align-items:center;
  background:#06101e;padding:9px 14px;border-radius:6px;
  font-size:13px;border:1px solid #1e3a5f33;
  transition:border-color 0.2s;
}
.player-row:hover{border-color:var(--border);}
.player-row .crown{color:var(--gold);}
.player-row .ready{color:var(--green);font-size:11px;}

#roomCodeDisplay{
  font-family:'Orbitron',monospace;font-size:32px;
  color:var(--gold);letter-spacing:10px;text-align:center;
  text-shadow:0 0 30px var(--gold)66;
  padding:8px 0;
}

/* ── HUD ── */
#hud{
  width:100%;max-width:700px;
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 10px;font-size:12px;font-weight:700;
  background:linear-gradient(180deg,#0d1525cc,#06101ecc);
  border-bottom:1px solid var(--border)77;
  flex-wrap:wrap;gap:4px;backdrop-filter:blur(10px);
}
#hud .hitem{display:flex;gap:5px;align-items:center;color:var(--muted);}
#hud .hitem span{color:var(--text);font-family:'Orbitron',monospace;font-size:11px;}
#timerBar{height:3px;background:#0d152577;width:100%;}
#timerFill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width 0.5s linear;box-shadow:0 0 8px var(--cyan);}
@media (max-width:400px){#hud{font-size:10px;padding:5px 8px;}#hud .hitem span{font-size:10px;}}

/* ── CANVAS WRAP ── */
#wrap{
  position:relative;overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 0 60px #00d4ff0a, inset 0 0 60px #000a;
  flex:1;width:100%;max-width:700px;
}
#wrap::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  pointer-events:none;z-index:2;
}
#gc{display:block;width:100%;height:100%;}

/* ── SCOREBOARD ── */
#scoreboard{
  position:absolute;top:8px;right:8px;
  background:#0d152599;backdrop-filter:blur(12px);
  border:1px solid var(--border)77;
  border-radius:8px;padding:8px 12px;
  min-width:140px;font-size:11px;display:none;
}
#scoreboard .sb-row{
  display:flex;justify-content:space-between;gap:10px;
  padding:3px 0;border-bottom:1px solid #1e3a5f22;
}
#scoreboard .sb-row:last-child{border:none;}
#scoreboard .sb-name{color:#7a9ab8;max-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#scoreboard .sb-pts{color:var(--gold);font-weight:700;font-family:'Orbitron',monospace;font-size:10px;}
#scoreboard .sb-me{color:var(--cyan);}

/* ── MINIMAP ── */
#minimap{
  position:absolute;bottom:8px;right:8px;
  border:1px solid var(--border)55;border-radius:4px;
  opacity:0.75;
}

/* ── D-PAD ── */
#dpad{
  display:none;position:relative;
  width:180px;height:180px;flex-shrink:0;
  margin:8px auto;
}
#dpad-center{
  position:absolute;top:60px;left:60px;
  width:60px;height:60px;
  background:radial-gradient(circle,#0d152555,#06101e33);
  border-radius:50%;border:1px solid var(--border)44;
}
.db{
  position:absolute;width:60px;height:60px;
  background:rgba(13,21,37,0.85);
  border:2px solid rgba(0,212,255,0.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--cyan);font-size:22px;
  display:flex;align-items:center;justify-content:center;
  border-radius:14px;cursor:pointer;
  user-select:none;-webkit-tap-highlight-color:transparent;
  transition:all 0.08s;
  box-shadow:0 4px 15px #00000066,inset 0 1px 0 #1e3a5f55,0 0 0 0 rgba(0,212,255,0);
  touch-action:none;
}
.db.on{
  background:rgba(0,212,255,0.2);
  border-color:rgba(0,212,255,0.9);
  box-shadow:0 0 25px #00d4ff55,inset 0 1px 0 #00d4ff33;
  transform:scale(0.9);
  color:#fff;
}
#db-u{top:0;left:60px}#db-d{bottom:0;left:60px}
#db-l{top:60px;left:0}#db-r{top:60px;right:0}

/* ── BREAK INDICATOR ── */
#brkInd{
  position:absolute;bottom:8px;left:8px;
  background:#0d152599;backdrop-filter:blur(8px);
  border:1px solid var(--border)55;border-radius:6px;
  padding:5px 10px;font-size:10px;color:var(--cyan);
  display:none;font-family:'Orbitron',monospace;
  text-shadow:0 0 8px var(--cyan)66;
}

/* ── END SCREEN ── */
#endPodium{width:100%;display:flex;flex-direction:column;gap:8px;}
.podium-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;border-radius:8px;
  background:#06101e;font-size:13px;
  border:1px solid var(--border)44;
}
.podium-row.first{background:#1a0d0055;border-color:var(--gold)55;box-shadow:0 0 20px #f5c84211;}
.podium-row .rank{font-size:20px;width:30px;text-align:center;}
.podium-row .pname{flex:1;font-weight:700;}
.podium-row .ppts{color:var(--gold);font-weight:700;font-size:15px;font-family:'Orbitron',monospace;}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#0d1525;border:1px solid var(--cyan)33;
  color:var(--text);padding:10px 22px;border-radius:20px;
  font-size:12px;opacity:0;transition:opacity 0.3s;
  pointer-events:none;z-index:100;white-space:nowrap;
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px #00d4ff11;
}
#toast.show{opacity:1;}

/* ── COOP HINT ── */
#coopHint{
  display:none;
  background:#001a2e;border:1px solid var(--cyan)22;
  border-radius:8px;padding:12px;font-size:11px;
  color:#7aadcc;line-height:1.8;
}

/* ── COUNTDOWN ── */
#cdNum{
  font-family:'Orbitron',monospace;
  font-size:90px;font-weight:900;
  color:var(--gold);
  text-shadow:0 0 60px var(--gold)88,0 0 120px var(--gold)33;
  animation:pulse 1s ease infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

@media (pointer:coarse){#dpad{display:block;}}
@media (pointer:fine){#dpad{display:block;}}
@media (max-width:500px){#hud{font-size:10px;}}
</style>
</head>
<body>

<!-- ══ SCREEN: MENU ══ -->
<div id="s-menu" class="screen active">
  <div class="game-title" data-text="متاهة الكنوز">متاهة الكنوز</div>
  <div class="card">
    <label>اسمك في اللعبة
      <input id="nameInput" placeholder="أدخل اسمك..." maxlength="16">
    </label>
    <button class="btn gold" id="btnCreate">إنشاء غرفة جديدة</button>
    <div class="divider">أو</div>
    <div class="row">
      <label>كود الغرفة
        <input id="joinCode" placeholder="XXXX" maxlength="6" style="text-transform:uppercase;letter-spacing:6px;text-align:center;">
      </label>
    </div>
    <button class="btn" id="btnJoin">الانضمام للغرفة</button>
    <div class="divider">أو</div>
    <button class="btn secondary" id="btnSolo">لعب منفرد</button>
  </div>
</div>

<!-- ══ SCREEN: CREATE ROOM ══ -->
<div id="s-create" class="screen">
  <h2>إعدادات الغرفة</h2>
  <div class="card">
    <div class="row">
      <label>حجم المتاهة
        <select id="cfgSize">
          <option value="sm">صغيرة ١١×١١</option>
          <option value="md">متوسطة ١٧×١٧</option>
          <option value="lg" selected>كبيرة ٢٥×٢٥</option>
          <option value="xl">ضخمة ٣١×٣١</option>
          <option value="xxl">عملاقة ٤١×٤١</option>
        </select>
      </label>
      <label>أقصى لاعبين
        <select id="cfgMaxPlayers">
          <option value="2">٢</option>
          <option value="4" selected>٤</option>
          <option value="6">٦</option>
          <option value="8">٨</option>
          <option value="10">١٠</option>
        </select>
      </label>
    </div>
    <label>نوع اللعبة
      <select id="cfgGameMode">
        <option value="ffa">فردي – كل واحد لنفسه</option>
        <option value="coop">تعاوني – فرق من اتنين</option>
      </select>
    </label>
    <div id="coopHint">
      <b style="color:var(--cyan)">مود تعاوني:</b> كل اتنين يكوّنوا فريق<br>
      🏃 <b>الرانر</b>: يتحرك بالداش، يجمع الكنوز<br>
      🧱 <b>الحيطة</b>: يساعد الرانر في فريقه بالحركة<br>
      النقاط بتحسب للفريق كله
    </div>
    <div class="row">
      <label>وقت المباراة
        <select id="cfgTime">
          <option value="60">٦٠ ث</option>
          <option value="120" selected>١٢٠ ث</option>
          <option value="180">١٨٠ ث</option>
          <option value="300">٣٠٠ ث</option>
          <option value="0">بدون وقت</option>
        </select>
      </label>
      <label>سكور الفوز
        <select id="cfgWinScore">
          <option value="0">بدون حد</option>
          <option value="300">٣٠٠</option>
          <option value="500" selected>٥٠٠</option>
          <option value="1000">١٠٠٠</option>
          <option value="2000">٢٠٠٠</option>
          <option value="3000">٣٠٠٠</option>
          <option value="4000">٤٠٠٠</option>
          <option value="5000">٥٠٠٠</option>
          <option value="6000">٦٠٠٠</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>الاختراق كل
        <select id="cfgBreak">
          <option value="3" selected>٣ ث</option>
          <option value="5">٥ ث</option>
          <option value="10">١٠ ث</option>
          <option value="0">حر</option>
        </select>
      </label>
      <label>عد تنازلي
        <select id="cfgCountdown">
          <option value="3" selected>٣ ث</option>
          <option value="5">٥ ث</option>
          <option value="10">١٠ ث</option>
        </select>
      </label>
    </div>
    <button class="btn gold" id="btnConfirmCreate">إنشاء الغرفة</button>
    <button class="btn secondary" id="btnBackCreate">رجوع</button>
  </div>
</div>

<!-- ══ SCREEN: LOBBY ══ -->
<div id="s-lobby" class="screen">
  <h2>الغرفة</h2>
  <div class="card" style="align-items:center;">
    <div style="font-size:12px;color:var(--muted);letter-spacing:1px;">شارك الكود مع أصحابك</div>
    <div id="roomCodeDisplay">----</div>
    <div id="lobbyPlayers"></div>
    <div id="lobbySettings" style="font-size:11px;color:var(--muted);text-align:center;line-height:1.9;"></div>
    <button class="btn gold" id="btnStartGame" style="display:none">ابدأ اللعبة ▶</button>
    <div id="waitingMsg" style="color:var(--muted);font-size:12px;letter-spacing:1px;">في انتظار صاحب الغرفة...</div>
    <button class="btn secondary" id="btnLeaveLobby">مغادرة</button>
  </div>
</div>

<!-- ══ SCREEN: COUNTDOWN ══ -->
<div id="s-countdown" class="screen">
  <div id="cdNum">3</div>
  <div style="color:var(--muted);font-size:13px;letter-spacing:3px;margin-top:10px;">استعد</div>
</div>

<!-- ══ SCREEN: GAME ══ -->
<div id="s-game" class="screen" style="padding:0;gap:0;">
  <div id="hud">
    <div class="hitem">⏱ <span id="hudTime">--</span></div>
    <div class="hitem">💎 <span id="hudCollected">0/0</span></div>
    <div class="hitem">🏆 <span id="hudScore">0</span></div>
    <div class="hitem">⚡ <span id="hudBreak" style="color:var(--cyan)">جاهز</span></div>
    <div class="hitem" id="hudRole" style="display:none"></div>
  </div>
  <div id="timerBar"><div id="timerFill"></div></div>
  <div id="wrap">
    <canvas id="gc"></canvas>
    <div id="scoreboard"></div>
    <canvas id="minimap" width="80" height="80"></canvas>
    <div id="brkInd">⚡ اختراق جاهز</div>
  </div>
  <div id="dpad">
    <div id="dpad-center"></div>
    <div class="db" id="db-u">▲</div>
    <div class="db" id="db-d">▼</div>
    <div class="db" id="db-l">◀</div>
    <div class="db" id="db-r">▶</div>
  </div>
</div>

<!-- ══ SCREEN: END ══ -->
<div id="s-end" class="screen">
  <div class="game-title" id="endTitle">انتهت اللعبة</div>
  <div class="card">
    <div id="endPodium"></div>
    <button class="btn gold" id="btnPlayAgain" style="display:none">لعبة جديدة</button>
    <button class="btn secondary" id="btnBackMenu">القائمة الرئيسية</button>
  </div>
</div>

<div id="toast"></div>

<script>
const ABLY_KEY = 'UcDcBw.YJJl6g:LDwkET05nlae7VeirAz44uL8hE16cLZ8MyrSFwCnolk';
const CELL = 32;
const SIZE_MAP = { sm:[11,11], md:[17,17], lg:[25,25], xl:[31,31], xxl:[41,41] };

// ══════════════════════════════════════════════════
//  🖼️ صور الخلفية والجدران - ضع روابط الصور هنا
// ══════════════════════════════════════════════════
// صورة أرضية المتاهة (تُفرد على كامل مساحة الخريطة)
const FLOOR_IMAGE_URL = 'https://i.postimg.cc/Y2TqgM5Z/Ancient_stone_floor_in_dungeon.png';   // ← ضع رابط صورة الأرضية هنا  مثال: 'images/floor.png'
// صورة مربعات الجدران (تتكرر على كل مربع جدار)
const WALL_IMAGE_URL  = 'https://i.postimg.cc/8k7zjjYS/Moss_covered_stone_slab_with_roots.png';   // ← ضع رابط صورة الجدران هنا   مثال: 'images/wall.png'

let floorImg = null;
let wallImg  = null;

function loadGameImages(){
  if(FLOOR_IMAGE_URL){
    floorImg = new Image();
    floorImg.src = FLOOR_IMAGE_URL;
  }
  if(WALL_IMAGE_URL){
    wallImg = new Image();
    wallImg.src = WALL_IMAGE_URL;
  }
}
loadGameImages();
// ══════════════════════════════════════════════════

// roundRect polyfill for older mobile browsers
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);
    this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);
    this.closePath();
  };
}

// Maze gen
function genMaze(cols,rows){
  const m=Array.from({length:rows},()=>new Uint8Array(cols).fill(1));
  const visited=Array.from({length:rows},()=>new Uint8Array(cols));
  function carve(c,r){
    visited[r][c]=1;m[r][c]=0;
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-.5);
    for(const[dc,dr] of dirs){
      const nc=c+dc,nr=r+dr;
      if(nc>0&&nc<cols-1&&nr>0&&nr<rows-1&&!visited[nr][nc]){m[r+dr/2][c+dc/2]=0;carve(nc,nr);}
    }
  }
  carve(1,1);
  for(let pass=0;pass<3;pass++){
    for(let r=1;r<rows-1;r++) for(let c=1;c<cols-1;c++){
      if(m[r][c]===0){
        const adj=[[0,-1],[0,1],[-1,0],[1,0]];
        const open=adj.filter(([dc,dr])=>m[r+dr]?.[c+dc]===0);
        if(open.length<=1){
          const walls=adj.filter(([dc,dr])=>r+dr>=1&&r+dr<rows-1&&c+dc>=1&&c+dc<cols-1&&m[r+dr][c+dc]===1);
          if(walls.length){ const[dc,dr]=walls[Math.floor(Math.random()*walls.length)]; m[r+dr][c+dc]=0; }
        }
      }
    }
  }
  for(let i=0;i<Math.floor(cols*rows/10);i++){
    const r=1+Math.floor(Math.random()*(rows-2));
    const c=1+Math.floor(Math.random()*(cols-2));
    const side=Math.floor(Math.random()*4);
    const dr=[0,0,1,-1][side],dc=[1,-1,0,0][side];
    if(r+dr>=1&&r+dr<rows-1&&c+dc>=1&&c+dc<cols-1) m[r+dr][c+dc]=0;
  }
  return m;
}

function placeTreasures(mazeData,cols,rows){
  const floor=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(mazeData[r][c]===0) floor.push({c,r});
  floor.sort(()=>Math.random()-.5);
  const n=Math.floor(floor.length*.3);
  return floor.slice(0,n).map(({c,r})=>{
    const def=TREASURE_DEF[Math.floor(Math.random()*TREASURE_DEF.length)];
    return {c,r,...def,got:false,t:Math.random()*Math.PI*2};
  });
}

function mazeToStr(m,cols,rows){ return cols+','+rows+','+Array.from(m,r=>Array.from(r).join('')).join('|'); }
function strToMaze(s){
  const parts=s.split(',');
  const cols=+parts[0],rows=+parts[1];
  const rows_data=parts[2].split('|');
  return {maze:rows_data.map(r=>new Uint8Array(r.split('').map(Number))),cols,rows};
}
function treasuresToStr(ts){ return ts.map(t=>`${t.c},${t.r},${t.sym},${t.val},${t.glow}`).join(';'); }
function strToTreasures(s){
  if(!s) return [];
  return s.split(';').map(p=>{
    const[c,r,sym,val,glow]=p.split(',');
    return {c:+c,r:+r,sym,val:+val,glow,got:false,t:Math.random()*Math.PI*2};
  });
}

// Game Start
async function hostStartGame(){
  const[cols,rows]=SIZE_MAP[roomConfig.size];
  const mazeData=genMaze(cols,rows);
  const trs=placeTreasures(mazeData,cols,rows);
  const members=await channel.presence.get();
  let spawnPoints;
  if(roomConfig.gameMode==='coop'){
    const teamCount=Math.ceil(members.length/2);
    const baseSpawns=getSpawnPoints(mazeData,cols,rows,teamCount);
    spawnPoints=[];
    baseSpawns.forEach(base=>{
      spawnPoints.push(base);
      const adj=[[1,0],[-1,0],[0,1],[0,-1]].find(([dc,dr])=>{
        const nc=base.c+dc,nr=base.r+dr;
        return nc>=1&&nc<cols-1&&nr>=1&&nr<rows-1&&mazeData[nr][nc]===0;
      });
      spawnPoints.push(adj?{c:base.c+(adj[0]),r:base.r+(adj[1])}:base);
    });
  } else {
    spawnPoints=getSpawnPoints(mazeData,cols,rows,members.length);
  }
  const playerSpawns={};
  members.forEach((m,i)=>{ playerSpawns[m.clientId]=spawnPoints[i]||{c:1,r:1}; });
  pub('game-start',{
    maze:mazeToStr(mazeData,cols,rows),
    treasures:treasuresToStr(trs),
    config:roomConfig,
    spawns:playerSpawns,
    playerList:members.map((m,i)=>({
      id:m.clientId,name:m.data?.name||m.clientId,
      animalIdx:i%RUNNER_ANIMALS.length,
      teamId:roomConfig.gameMode==='coop'?Math.floor(i/2):i,
      role:roomConfig.gameMode==='coop'?(i%2===0?'dasher':'wall'):'dasher'
    }))
  });
}

function getSpawnPoints(mazeData,cols,rows,n){
  const candidates=[];
  for(let r=1;r<rows-1;r++) for(let c=1;c<cols-1;c++) if(mazeData[r][c]===0) candidates.push({c,r});
  candidates.sort(()=>Math.random()-.5);
  const corners=[{c:1,r:1},{c:cols-2,r:1},{c:1,r:rows-2},{c:cols-2,r:rows-2}].filter(pt=>mazeData[pt.r][pt.c]===0);
  const result=[...corners];
  for(const p of candidates){
    if(result.length>=n) break;
    if(!result.some(r=>Math.abs(r.c-p.c)+Math.abs(r.r-p.r)<Math.floor((cols+rows)/6))) result.push(p);
  }
  while(result.length<n) result.push(candidates[result.length]||{c:1,r:1});
  return result;
}

function updateLocal(){
  if(!myPlayer) return;
  if(myPlayer.role!=='wall'&&myPlayer.breakCD>0) myPlayer.breakCD--;
  if(myPlayer.role==='wall'&&myPlayer.dash){
    myPlayer.dash.t++;
    const pp=Math.min(myPlayer.dash.t/myPlayer.dash.dur,1);
    const e=1-Math.pow(1-pp,3);
    myPlayer.px=myPlayer.dash.fromPx+(myPlayer.dash.toPx-myPlayer.dash.fromPx)*e;
    myPlayer.py=myPlayer.dash.fromPy+(myPlayer.dash.toPy-myPlayer.dash.fromPy)*e;
    if(myPlayer.dash.t>=myPlayer.dash.dur){myPlayer.px=myPlayer.dash.toPx;myPlayer.py=myPlayer.dash.toPy;myPlayer.dash=null;}
  }
  if(localDash){
    localDash.t++;
    const p=Math.min(localDash.t/localDash.dur,1);
    // smooth ease: cubic in-out for gentle feel
    const e=p<0.5?4*p*p*p:(1-Math.pow(-2*p+2,3)/2);
    myPlayer.px=localDash.fromPx+(localDash.toPx-localDash.fromPx)*e;
    myPlayer.py=localDash.fromPy+(localDash.toPy-localDash.fromPy)*e;
    const passed=Math.ceil(p*localDash.path.length);
    for(let i=0;i<passed;i++){
      const cell=localDash.path[i];
      if(!cell.checked){cell.checked=true;tryCollect(cell.c,cell.r);}
    }
    if(localDash.t>=localDash.dur){
      myPlayer.px=localDash.toPx;myPlayer.py=localDash.toPy;
      localDash.path.forEach(cell=>{if(!cell.checked){cell.checked=true;tryCollect(cell.c,cell.r);}});
      localDash=null;
      pubMove();
    }
  }
  particles=particles.filter(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life-=p.decay;return p.life>0; });
  floats=floats.filter(f=>{ f.y-=0.55;f.life-=0.018;return f.life>0; });
  // Trail
  if(!myPlayer.trailPts) myPlayer.trailPts=[];
  myPlayer.trailPts.push({x:myPlayer.px,y:myPlayer.py});
  if(myPlayer.trailPts.length>18) myPlayer.trailPts.shift();
  updateGameHUD();
}

function pubMove(){
  if(!myPlayer) return;
  pub('player-move',{col:myPlayer.col,row:myPlayer.row,px:myPlayer.px,py:myPlayer.py,role:myPlayer.role,teamId:myPlayer.teamId});
}
function onPlayerMove(d){
  if(d.from===myId) return;
  if(!players[d.from]) return;
  const p=players[d.from];
  if(d.role) p.role=d.role;
  if(d.teamId!==undefined) p.teamId=d.teamId;
  const fromPx=p.px,fromPy=p.py;
  const toPx=d.col*CELL+CELL/2,toPy=d.row*CELL+CELL/2;
  p.col=d.col;p.row=d.row;
  p.dash={fromPx,fromPy,toPx,toPy,t:0,dur:8};
}
function onPlayerScore(d){ if(players[d.from]) players[d.from].score=d.score; }
function onTreasureTook(d){ const t=treasures.find(t=>t.c===d.c&&t.r===d.r&&!t.got); if(t) t.got=true; }

// Input
const held={};
document.addEventListener('keydown',e=>{
  if(held[e.key]) return;held[e.key]=true;
  const dir=keyToDir(e.key);if(dir) tryInput(dir);
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup',e=>{held[e.key]=false;});
function keyToDir(k){
  if(k==='ArrowUp'||k==='w'||k==='W') return [0,-1];
  if(k==='ArrowDown'||k==='s'||k==='S') return [0,1];
  if(k==='ArrowLeft'||k==='a'||k==='A') return [-1,0];
  if(k==='ArrowRight'||k==='d'||k==='D') return [1,0];
  return null;
}
function tryInput(dir){
  if(!gameRunning||!myPlayer) return;
  if(myPlayer.role==='wall'){doWallMove(dir);return;}
  // If currently moving, snap to destination immediately then move
  if(localDash){
    myPlayer.px=localDash.toPx;myPlayer.py=localDash.toPy;
    localDash.path.forEach(cell=>{if(!cell.checked){cell.checked=true;tryCollect(cell.c,cell.r);}});
    localDash=null;
    pubMove();
  }
  doLocalDash(dir);
}
function doWallMove(dir){
  const[dc,dr]=dir;
  const nc=myPlayer.col+dc,nr=myPlayer.row+dr;
  if(nc<0||nc>=COLS||nr<0||nr>=ROWS) return;
  if(maze[nr][nc]===1) return;
  const blockedByTeammate=Object.values(players).some(p=>p!==myPlayer&&p.teamId===myPlayer.teamId&&p.col===nc&&p.row===nr);
  if(blockedByTeammate){spawnBurst(nc*CELL+CELL/2,nr*CELL+CELL/2,'#ff3366',4);return;}
  myPlayer.col=nc;myPlayer.row=nr;
  const toPx=nc*CELL+CELL/2,toPy=nr*CELL+CELL/2;
  myPlayer.dash={fromPx:myPlayer.px,fromPy:myPlayer.py,toPx,toPy,t:0,dur:4};
  pubMove();
}
function doLocalDash(dir){
  const[dc,dr]=dir;
  let c=myPlayer.col,r=myPlayer.row;
  const wc=c+dc,wr=r+dr;
  if(wc>=0&&wc<COLS&&wr>=0&&wr<ROWS&&maze[wr][wc]===1){
    if(myPlayer.breakCD<=0){
      const bc=wc+dc,br=wr+dr;
      if(bc>=1&&bc<COLS-1&&br>=1&&br<ROWS-1){
        maze[wr][wc]=0;myPlayer.breakCD=BREAK_COOLDOWN_FRAMES;
        sfxBreakWall();spawnBurst(wc*CELL+CELL/2,wr*CELL+CELL/2,'#f5c842',15);
        floats.push({x:wc*CELL+CELL/2,y:wr*CELL+CELL/2-20,text:'💥',col:'#f5c842',life:1.5});
      } else return;
    } else {
      spawnBurst(wc*CELL+CELL/2,wr*CELL+CELL/2,'#ff3366',5);return;
    }
  }
  while(true){
    const nc=c+dc,nr=r+dr;
    if(nc<0||nc>=COLS||nr<0||nr>=ROWS||maze[nr][nc]===1) break;
    const wallBlocker=Object.values(players).find(p=>p.role==='wall'&&p.teamId===myPlayer.teamId&&p.col===nc&&p.row===nr);
    if(wallBlocker) break;
    c=nc;r=nr;
  }
  if(c===myPlayer.col&&r===myPlayer.row){pendingDash=null;return;}
  const path=[];
  let tc=myPlayer.col,tr=myPlayer.row;
  while(tc!==c||tr!==r){tc+=dc;tr+=dr;path.push({c:tc,r:tr,checked:false});}
  const fromPx=myPlayer.px,fromPy=myPlayer.py;
  const toPx=c*CELL+CELL/2,toPy=r*CELL+CELL/2;
  const dist=Math.abs(c-myPlayer.col)+Math.abs(r-myPlayer.row);
  const dur=Math.max(4,Math.min(dist*0.9,12));
  myPlayer.col=c;myPlayer.row=r;
  sfxDash();
  localDash={fromPx,fromPy,toPx,toPy,t:0,dur,path};
}

function tryCollect(c,r){
  const t=treasures.find(t=>t.c===c&&t.r===r&&!t.got);
  if(!t) return;
  t.got=true;myPlayer.score+=t.val;
  sfxCollect(t.val);
  spawnBurst(myPlayer.px,myPlayer.py,t.glow,12);
  floats.push({x:myPlayer.px,y:myPlayer.py-20,text:'+'+t.val,col:t.glow,life:1});
  pub('treasure-took',{c,r});pub('player-score',{score:myPlayer.score});
  if(winScore>0&&myPlayer.score>=winScore&&isHost){
    clearInterval(timerInterval);pub('game-end',{reason:'score',winner:myId,scores:getScores()});
  }
}

function getScores(){
  if(roomConfig.gameMode==='coop'){
    const teams={};
    Object.entries(players).forEach(([id,p])=>{
      if(!teams[p.teamId]) teams[p.teamId]={score:0,members:[]};
      teams[p.teamId].score+=p.score;teams[p.teamId].members.push(p);
    });
    return Object.values(teams).sort((a,b)=>b.score-a.score)
      .map(t=>({name:t.members.map(p=>p.name).join(' & '),score:t.score}));
  }
  return Object.entries(players).map(([id,p])=>({id,name:p.name,score:p.score})).sort((a,b)=>b.score-a.score);
}

// ═══════════════════════════════════
//  DRAW
// ═══════════════════════════════════
function drawGame(){
  if(!ctx||!myPlayer) return;
  ctx.clearRect(0,0,VW,VH);
  const ZOOM=0.65;
  const scaledVW=VW/ZOOM, scaledVH=VH/ZOOM;
  const offX=Math.max(0,Math.min(myPlayer.px-scaledVW/2,MW-scaledVW));
  const offY=Math.max(0,Math.min(myPlayer.py-scaledVH/2,MH-scaledVH));
  ctx.save();
  ctx.scale(ZOOM,ZOOM);
  ctx.translate(-offX,-offY);

  // Background floor
  if(floorImg && floorImg.complete && floorImg.naturalWidth>0){
    // 🖼️ صورة الأرضية تُفرد على كامل مساحة الخريطة
    ctx.drawImage(floorImg, 0, 0, MW, MH);
  } else {
    // اللون الافتراضي لو مفيش صورة
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(maze[r][c]===0){
        const x=c*CELL,y=r*CELL;
        const even=(c+r)%2===0;
        ctx.fillStyle=even?'#1e2d45':'#192540';
        ctx.fillRect(x,y,CELL,CELL);
      }
    }
  }

  // Walls
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(maze[r][c]===1){
      const x=c*CELL,y=r*CELL;
      if(wallImg && wallImg.complete && wallImg.naturalWidth>0){
        // 🖼️ صورة الجدار على كل مربع جدار
        ctx.drawImage(wallImg, x, y, CELL, CELL);
      } else {
        // الشكل الافتراضي لو مفيش صورة
        ctx.fillStyle='#2e5a8e';
        ctx.fillRect(x,y,CELL,CELL);
        ctx.fillStyle='#3d7ab8';
        ctx.fillRect(x,y,CELL,3);
        ctx.fillStyle='#356aa0';
        ctx.fillRect(x,y,3,CELL);
        ctx.fillStyle='#1a3a5c';
        ctx.fillRect(x,y+CELL-3,CELL,3);
        ctx.fillStyle='#1a3a5c';
        ctx.fillRect(x+CELL-3,y,3,CELL);
      }
    }
  }

  // No trail drawing - removed

  // Other players animate
  Object.entries(players).forEach(([id,p])=>{
    if(id===myId) return;
    if(p.dash){
      p.dash.t++;
      const pp=Math.min(p.dash.t/p.dash.dur,1);
      const e=1-Math.pow(1-pp,3);
      p.px=p.dash.fromPx+(p.dash.toPx-p.dash.fromPx)*e;
      p.py=p.dash.fromPy+(p.dash.toPy-p.dash.fromPy)*e;
      if(p.dash.t>=p.dash.dur){p.px=p.dash.toPx;p.py=p.dash.toPy;p.dash=null;}
    }
  });

  // Treasures
  ctx.textAlign='center';ctx.textBaseline='middle';
  const tSize=Math.round(CELL*.85);
  treasures.forEach(t=>{
    if(t.got) return;
    const tx=t.c*CELL+CELL/2, ty=t.r*CELL+CELL/2;
    ctx.font=`${tSize}px serif`;
    ctx.fillText(t.sym,tx,ty);
  });

  // Draw all players
  Object.entries(players).forEach(([id,p])=>{
    if(id===myId) return;
    drawPlayer(p.px,p.py,p.name,false,p.role||'dasher',p.animalIdx??0,p.teamId);
  });
  // Trail with gradient fade
  if(myPlayer.trailPts&&myPlayer.trailPts.length>1){
    const pts=myPlayer.trailPts;
    const tail=pts[0], head=pts[pts.length-1];
    const grad=ctx.createLinearGradient(tail.x,tail.y,head.x,head.y);
    grad.addColorStop(0,'rgba(0,212,255,0)');
    grad.addColorStop(1,'rgba(0,212,255,0.85)');
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.strokeStyle=grad;
    ctx.lineWidth=5;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.stroke();
  }
  if(myPlayer) drawPlayer(myPlayer.px,myPlayer.py,myPlayer.name,true,myPlayer.role||'dasher',myPlayer.animalIdx??0,myPlayer.teamId);

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life*0.9;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*.65,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Floats - bigger text for mobile
  floats.forEach(f=>{
    const fontSize=window.innerWidth<700?16:13;
    ctx.font=`bold ${fontSize}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='#000000cc';ctx.lineWidth=4;
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.col;ctx.fillText(f.text,f.x,f.y);
  });
  ctx.globalAlpha=1;
  ctx.restore();

  // No per-frame vignette gradient - handled by CSS

  drawMinimap(offX,offY);
  updateScoreboard();
}


function drawPlayer(x,y,name,isMe=false,role='dasher',animalIdx=0,teamId=null){
  const R=CELL*.48;
  const emoji=role==='wall'?WALL_EMOJIS[animalIdx%WALL_EMOJIS.length]:RUNNER_ANIMALS[animalIdx%RUNNER_ANIMALS.length];

  // Emoji only
  ctx.font=`${Math.round(R*2.4)}px serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(emoji,x,y+1);

  // Name tag
  const nm=(isMe?'▸ ':'')+name;
  ctx.font=`bold 11px 'Cairo',sans-serif`;
  const tw=ctx.measureText(nm).width;
  const tagY=y-R*1.55-15;
  const tagW=tw+12, tagH=15;
  ctx.fillStyle=isMe?'rgba(0,15,30,0.95)':'rgba(5,8,15,0.88)';
  ctx.beginPath();ctx.roundRect(x-tagW/2,tagY,tagW,tagH,4);ctx.fill();
  ctx.strokeStyle=isMe?'rgba(0,212,255,0.7)':'rgba(30,58,95,0.5)';
  ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=isMe?'#00e5ff':'#a8c4d8';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(nm,x,tagY+2);
}

function drawMinimap(offX,offY){
  const mm=document.getElementById('minimap');
  const mc=mm.getContext('2d');
  const mw=80,mh=80;
  const cw=mw/COLS,ch=mh/ROWS;
  mc.clearRect(0,0,mw,mh);
  mc.fillStyle='#060a12ee';mc.fillRect(0,0,mw,mh);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(maze[r][c]===1){mc.fillStyle='#1e3a5f';mc.fillRect(c*cw,r*ch,cw,ch);}
  }
  treasures.forEach(t=>{
    if(t.got) return;
    mc.fillStyle=t.glow;mc.fillRect(t.c*cw+cw*.15,t.r*ch+ch*.15,cw*.7,ch*.7);
  });
  Object.entries(players).forEach(([id,p])=>{
    mc.fillStyle=id===myId?'#00d4ff':'#f5c842';
    mc.beginPath();mc.arc(p.col*cw+cw/2,p.row*ch+ch/2,Math.max(cw,ch)*1,0,Math.PI*2);mc.fill();
  });
}

function updateScoreboard(){
  const sb=document.getElementById('scoreboard');
  if(roomConfig.gameMode==='coop'){
    const teams={};
    Object.entries(players).forEach(([id,p])=>{
      if(!teams[p.teamId]) teams[p.teamId]={members:[],score:0};
      teams[p.teamId].members.push({id,p});teams[p.teamId].score+=p.score;
    });
    const sorted=Object.entries(teams).sort(([,a],[,b])=>b.score-a.score);
    sb.innerHTML=sorted.map(([tid,t])=>{
      const isMyTeam=t.members.some(({id})=>id===myId);
      const names=t.members.map(({id,p})=>{
        const ani=p.role==='wall'?WALL_EMOJIS[p.animalIdx??0]:RUNNER_ANIMALS[p.animalIdx??0];
        return ani+p.name;
      }).join(' & ');
      return `<div class="sb-row">
        <span class="sb-name ${isMyTeam?'sb-me':''}">${isMyTeam?'▶ ':''}${names}</span>
        <span class="sb-pts">${t.score}</span></div>`;
    }).join('');
  } else {
    const sorted=Object.entries(players).sort(([,a],[,b])=>b.score-a.score);
    sb.innerHTML=sorted.map(([id,p])=>`
      <div class="sb-row">
        <span class="sb-name ${id===myId?'sb-me':''}">${id===myId?'▶ ':RUNNER_ANIMALS[p.animalIdx??0]} ${p.name}</span>
        <span class="sb-pts">${p.score}</span>
      </div>`).join('');
  }
}

function updateGameHUD(){
  if(!myPlayer) return;
  if(roomConfig.gameMode==='coop'){
    const teamScore=Object.values(players).filter(p=>p.teamId===myPlayer.teamId).reduce((s,p)=>s+p.score,0);
    document.getElementById('hudScore').textContent='فريق: '+teamScore;
  } else {
    document.getElementById('hudScore').textContent=myPlayer.score;
  }
  const got=treasures.filter(t=>t.got).length;
  document.getElementById('hudCollected').textContent=got+'/'+totalTreasures;
  const roleEl=document.getElementById('hudRole');
  if(roomConfig.gameMode==='coop'){
    roleEl.style.display='flex';
    if(myPlayer.role==='wall'){
      roleEl.innerHTML=WALL_EMOJIS[myPlayer.animalIdx??0]+' <span style="color:#f5c842">أنت الحيطة</span>';
      document.getElementById('hudBreak').parentElement.style.display='none';
    } else {
      roleEl.innerHTML=RUNNER_ANIMALS[myPlayer.animalIdx??0]+' <span style="color:#00ff88">أنت الرانر</span>';
      document.getElementById('hudBreak').parentElement.style.display='flex';
    }
  } else {
    roleEl.style.display='none';
  }
  const brkEl=document.getElementById('hudBreak');
  const brkInd=document.getElementById('brkInd');
  if(myPlayer.role!=='wall'){
    if(myPlayer.breakCD<=0){
      brkEl.textContent='جاهز';brkEl.style.color='#00d4ff';
      brkInd.textContent='⚡ اختراق جاهز';brkInd.style.color='#00d4ff';
    } else {
      const secs=Math.ceil(myPlayer.breakCD/60);
      brkEl.textContent=secs+'s';brkEl.style.color='#4a6a8a';
      brkInd.textContent=`⏳ ${secs}s`;brkInd.style.color='#4a6a8a';
    }
  } else {
    brkInd.style.display='none';
  }
}

// Particles
function spawnBurst(x,y,col,n){
  const isMobile=window.innerWidth<700;
  const scale=isMobile?1.5:1;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(1.5+Math.random()*4)*scale;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,decay:0.025+Math.random()*.025,size:(2+Math.random()*4)*scale,col});
  }
}

function onGameEnd(d){
  gameRunning=false;clearInterval(timerInterval);cancelAnimationFrame(raf);
  sfxWin();showScreen('end');
  const scores=d.scores||getScores();
  const medals=['🥇','🥈','🥉'];
  document.getElementById('endTitle').textContent=d.reason==='score'?'وصل أحد اللاعبين للهدف!':'انتهى الوقت!';
  document.getElementById('endPodium').innerHTML=scores.slice(0,6).map((p,i)=>`
    <div class="podium-row ${i===0?'first':''}">
      <span class="rank">${medals[i]||'  '}</span>
      <span class="pname">${p.name}</span>
      <span class="ppts">${p.score}</span>
    </div>`).join('');
  document.getElementById('btnPlayAgain').style.display=isHost?'block':'none';
}

// Touch
const wrap2=document.getElementById('wrap');
let swipeLocked=false; // منع تسجيل أكثر من سوايب واحد في نفس الوقت
wrap2.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  swipeLocked=false; // إعادة تفعيل عند بداية لمسة جديدة
},{passive:true});
wrap2.addEventListener('touchend',e=>{
  if(swipeLocked) return; // تجاهل السوايب المكرر
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  const minSwipe=20; // رفع الحد الأدنى من 12 إلى 20 لتقليل الحساسية الزائدة
  if(Math.abs(dx)<minSwipe&&Math.abs(dy)<minSwipe) return;
  swipeLocked=true; // قفل فوري بعد أول حركة مسجّلة
  if(Math.abs(dx)>Math.abs(dy)) tryInput(dx>0?[1,0]:[-1,0]);
  else tryInput(dy>0?[0,1]:[0,-1]);
},{passive:true});

const dirMap={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
const dpadHold={};
['u','d','l','r'].forEach(k=>{
  const b=document.getElementById('db-'+k);
  const startHold=()=>{
    if(dpadHold[k]) return;
    b.classList.add('on');tryInput(dirMap[k]);
    dpadHold[k]={timer:setTimeout(function repeat(){tryInput(dirMap[k]);dpadHold[k].timer=setTimeout(repeat,60);},100)};
  };
  const stopHold=()=>{
    b.classList.remove('on');
    if(dpadHold[k]){clearTimeout(dpadHold[k].timer);dpadHold[k]=null;}
  };
  b.addEventListener('touchstart',e=>{e.preventDefault();startHold();},{passive:false});
  b.addEventListener('touchend',stopHold,{passive:true});
  b.addEventListener('touchcancel',stopHold,{passive:true});
  b.addEventListener('mousedown',e=>{e.preventDefault();startHold();});
  b.addEventListener('mouseup',stopHold);
  b.addEventListener('mouseleave',stopHold);
});

// Solo
function startSolo(){
  const[cols,rows]=SIZE_MAP['lg'];
  const mazeData=genMaze(cols,rows);
  const trs=placeTreasures(mazeData,cols,rows);
  maze=mazeData;COLS=cols;ROWS=rows;
  MW=COLS*CELL;MH=ROWS*CELL;
  treasures=trs;totalTreasures=trs.length;
  BREAK_COOLDOWN_FRAMES=180;winScore=0;
  roomConfig={gameSecs:0,breakSecs:3};
  players={};
  players[myId]={name:myName||'أنت',animalIdx:0,
    col:1,row:1,px:CELL+CELL/2,py:CELL+CELL/2,
    score:0,dash:null,trail:[],breakCD:0,role:'dasher'};
  myPlayer=players[myId];
  setupCanvas();
  buildTreasureGlowCache();
  particles=[];floats=[];pendingDash=null;localDash=null;
  gameRunning=true;
  document.getElementById('scoreboard').style.display='none';
  document.getElementById('brkInd').style.display='block';
  showScreen('game');
  updateTimerUI();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(gameLoop);
}

// Sound
let audioCtx=null;
function getAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq,type,dur,vol=0.15,decay=true){
  try{
    const ac=getAudio();
    const osc=ac.createOscillator();const gain=ac.createGain();
    osc.connect(gain);gain.connect(ac.destination);
    osc.type=type;osc.frequency.setValueAtTime(freq,ac.currentTime);
    gain.gain.setValueAtTime(vol,ac.currentTime);
    if(decay) gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    osc.start(ac.currentTime);osc.stop(ac.currentTime+dur);
  }catch(e){}
}
function sfxCollect(val){ const b=300+val*2; playTone(b,'sine',0.08,0.14); setTimeout(()=>playTone(b*1.5,'sine',0.1,0.11),60); setTimeout(()=>playTone(b*2,'sine',0.09,0.09),130); }
function sfxBreakWall(){ try{ const ac=getAudio(); const buf=ac.createBuffer(1,ac.sampleRate*.15,ac.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2); const src=ac.createBufferSource(); const gain=ac.createGain(); src.buffer=buf;src.connect(gain);gain.connect(ac.destination); gain.gain.setValueAtTime(0.25,ac.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+.15); src.start(); }catch(e){} }
function sfxDash(){ try{ const ac=getAudio(); const osc=ac.createOscillator(); const gain=ac.createGain(); osc.connect(gain);gain.connect(ac.destination); osc.type='sawtooth'; osc.frequency.setValueAtTime(380,ac.currentTime); osc.frequency.exponentialRampToValueAtTime(140,ac.currentTime+0.1); gain.gain.setValueAtTime(0.07,ac.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.1); osc.start(ac.currentTime);osc.stop(ac.currentTime+0.1); }catch(e){} }
function sfxCountdown(n){ if(n>0) playTone(n===1?880:440,'sine',0.2,0.22); else { playTone(660,'sine',0.15,0.28); setTimeout(()=>playTone(880,'sine',0.2,0.25),150); } }
function sfxWin(){ const notes=[523,659,784,1047]; notes.forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.3,0.3),i*110)); }
