<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treasure Maze</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background-color: #0b0614; /* Dark background for maze */
  font-family: sans-serif;
  color: #eee;
  text-align: center;
}
canvas {
  display: block;
  background-color: #0b0614;
}
#game-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
#game-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 100;
  color: white;
  font-size: 1.5em;
}
#game-overlay h1 {
  color: #ffd700; /* Gold color for title */
  font-size: 2.5em;
  text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
}
#game-overlay button {
  padding: 15px 30px;
  font-size: 1.2em;
  background-color: #ffd700;
  color: #0b0614;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.3s ease;
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
}
#game-overlay button:hover {
  background-color: #e6c200;
}
#score-board {
  position: absolute;
  top: 10px;
  left: 10px;
  background-color: rgba(0, 0, 0, 0.5);
  padding: 10px;
  border-radius: 5px;
  z-index: 101;
  font-size: 1.1em;
}
#message-display {
  position: absolute;
  top: 10px;
  right: 10px;
  background-color: rgba(0, 0, 0, 0.5);
  padding: 10px;
  border-radius: 5px;
  z-index: 101;
  font-size: 1.1em;
  max-width: 300px;
  text-align: right;
}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
</div>
<div id="game-overlay">
  <h1>Treasure Maze</h1>
  <p>Find the treasure before time runs out!</p>
  <button onclick="startGame()">Start Game</button>
</div>
<div id="score-board">Score: <span id="score">0</span></div>
<div id="message-display"></div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CELL = 40; // Cell size in pixels
const MAZE_WIDTH = 25; // Cells
const MAZE_HEIGHT = 15; // Cells

canvas.width = MAZE_WIDTH * CELL;
canvas.height = MAZE_HEIGHT * CELL;

const TREASURE_COLOR = '#ffd700'; // Gold
const WALL_COLOR = '#3a3a3a'; // Dark grey
const PATH_COLOR = '#0b0614'; // Matching background for path

const RUNNER_EMOJIS = ["🐸", "🐱", "🐭", "🦄", "🪼"];
const WALL_EMOJIS_BY_RUNNER_INDEX = ["🟩", "🟨", "⬜", "🟪", "🟦"];

const TREASURE_DEF = [
  {x: 1, y: 1}, {x: MAZE_WIDTH - 2, y: 1}, {x: 1, y: MAZE_HEIGHT - 2},
  {x: MAZE_WIDTH - 2, y: MAZE_HEIGHT - 2}
];
let treasures = [];

let maze = [];
let players = {};
let myId = null;
let myPlayer = null;
let gameStarted = false;
let roomConfig = { gameMode: 'solo' }; // Default to solo
let teamColors = ['#55aaff', '#ff55aa', '#aaff55', '#ffaa55', '#55ffa0']; // Example team colors

// Utility function to lighten a color
function lightenColor(col, amt) {
    var usePound = false;
    if (col[0] == "#") {
        col = col.slice(1);
        usePound = true;
    }
    var num = parseInt(col, 16);
    var r = (num >> 16) + amt;
    if (r > 255) r = 255;
    else if (r < 0) r = 0;
    var b = ((num >> 8) & 0x00FF) + amt;
    if (b > 255) b = 255;
    else if (b < 0) b = 0;
    var g = (num & 0x0000FF) + amt;
    if (g > 255) g = 255;
    else if (g < 0) g = 0;
    return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16);
}

// Function to draw rounded rectangles for walls (if needed for other elements)
function roundRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function generateMaze() {
  maze = Array(MAZE_HEIGHT).fill(0).map(() => Array(MAZE_WIDTH).fill(1)); // 1 for wall

  function carvePath(cx, cy) {
    const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]].sort(() => Math.random() - 0.5);
    for (const [dx, dy] of directions) {
      const nx = cx + dx * 2;
      const ny = cy + dy * 2;
      if (nx >= 0 && nx < MAZE_WIDTH && ny >= 0 && ny < MAZE_HEIGHT && maze[ny][nx] === 1) {
        maze[cy + dy][cx + dx] = 0; // Carve path
        maze[ny][nx] = 0; // Move to next cell
        carvePath(nx, ny);
      }
    }
  }

  // Start carving from a random point
  const startX = Math.floor(Math.random() * (MAZE_WIDTH / 2)) * 2 + 1;
  const startY = Math.floor(Math.random() * (MAZE_HEIGHT / 2)) * 2 + 1;
  maze[startY][startX] = 0;
  carvePath(startX, startY);

  // Ensure border walls
  for(let i = 0; i < MAZE_WIDTH; i++) {
    maze[0][i] = 1;
    maze[MAZE_HEIGHT - 1][i] = 1;
  }
  for(let i = 0; i < MAZE_HEIGHT; i++) {
    maze[i][0] = 1;
    maze[i][MAZE_WIDTH - 1] = 1;
  }
}

function drawMaze() {
  for (let y = 0; y < MAZE_HEIGHT; y++) {
    for (let x = 0; x < MAZE_WIDTH; x++) {
      if (maze[y][x] === 1) {
        ctx.fillStyle = WALL_COLOR;
        roundRect(ctx, x * CELL, y * CELL, CELL, CELL, 5); // Walls with slight rounding
        ctx.fill();
        // Add some texture to the walls
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;
        ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
      } else {
        ctx.fillStyle = PATH_COLOR;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
  }
}

function drawTreasure(x, y) {
  const cx = x * CELL + CELL / 2;
  const cy = y * CELL + CELL / 2;
  const R = CELL * 0.3;

  // Gold glow effect
  const glowGrd = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 2);
  glowGrd.addColorStop(0, TREASURE_COLOR + '88');
  glowGrd.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrd;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 2, 0, Math.PI * 2);
  ctx.fill();

  // Treasure chest shape (simplified)
  ctx.fillStyle = TREASURE_COLOR;
  ctx.beginPath();
  ctx.moveTo(cx - R, cy);
  ctx.lineTo(cx, cy - R);
  ctx.lineTo(cx + R, cy);
  ctx.lineTo(cx, cy + R);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = lightenColor(TREASURE_COLOR, -50);
  ctx.lineWidth = 2;
  ctx.stroke();

  // Sparkle effect
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  for (let i = 0; i < 4; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * R * 0.8;
    const sx = cx + Math.cos(angle) * dist;
    const sy = cy + Math.sin(angle) * dist;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.random() * 2 + 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlayer(x,y,color,name,isMe=false,role='dasher',teamId=null,teamColor=null, emoji = null){
  const R=CELL*.38;

  // Team ring (coop mode) - orbit ring around player
  if(roomConfig.gameMode==='coop' && teamColor){
    ctx.save();
    ctx.strokeStyle=teamColor;
    ctx.lineWidth=2.5;
    ctx.globalAlpha=0.6;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.arc(x,y,R+5,0,Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // Outer glow
  const grd=ctx.createRadialGradient(x,y,0,x,y,R*3);
  grd.addColorStop(0,color+'33'); grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(x,y,R*3,0,Math.PI*2); ctx.fill();

  // Draw emoji directly based on role and assigned emoji
  const playerEmoji = players[myId].emoji; // Assuming myPlayer is accessible here
  if(emoji === null){
      // This path should ideally not be taken if emojis are properly assigned
      // Fallback or debug, if needed
      emoji = role === 'wall' ? '🧱' : '❓'; // Default fallback
  }


  ctx.save();
  ctx.font=`${Math.round(CELL*.6)}px Arial`; // Use a standard emoji-friendly font
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.5)'; // Subtle shadow for pop
  ctx.shadowBlur=4;
  ctx.fillText(emoji, x, y);
  ctx.restore();

  // Name tag with backdrop
  const nm = (isMe?'▸ ':'')+name;
  ctx.font=`${isMe?'bold ':''} 9px sans-serif`;
  const tw=ctx.measureText(nm).width;
  ctx.fillStyle='#0b061488';
  ctx.fillRect(x-tw/2-3, y-R-15, tw+6, 13);
  ctx.fillStyle=isMe?'#fff':'#ccc';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(nm,x,y-R-3);
}

function drawGame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMaze();
  treasures.forEach(t => drawTreasure(t.x, t.y));

  for (const id in players) {
    const p = players[id];
    if (id !== myId) {
      drawPlayer(p.px,p.py,p.color,p.name,false,p.role||'dasher',p.teamId,teamColors[p.teamId]||null, p.emoji);
    }
  }
  if(myPlayer) drawPlayer(myPlayer.px,myPlayer.py,myPlayer.color||'#5599ff',myPlayer.name,true,myPlayer.role||'dasher',myPlayer.teamId,teamColors[myPlayer.teamId]||null, myPlayer.emoji);

  requestAnimationFrame(drawGame);
}

function onGameStart(config) {
  roomConfig = config;
  generateMaze();
  treasures = TREASURE_DEF.map(t => ({...t, collected: false}));

  // Dummy player initialization for demonstration
  // In a real game, this would come from a server
  players = {};
  myId = 'player1';
  players[myId] = {
    id: myId,
    name: 'Player 1',
    px: CELL + CELL/2,
    py: CELL + CELL/2,
    color: '#5599ff',
    score:0, dash:null, trail:[], emoji: roomConfig.gameMode==='coop' ? (0 % 2===0 ? RUNNER_EMOJIS[Math.floor(0/2) % RUNNER_EMOJIS.length] : WALL_EMOJIS_BY_RUNNER_INDEX[Math.floor(0/2) % WALL_EMOJIS_BY_RUNNER_INDEX.length]) : RUNNER_EMOJIS[0 % RUNNER_EMOJIS.length]
  };
  myPlayer = players[myId];

  // Add a second player for coop mode demonstration
  if (roomConfig.gameMode === 'coop') {
    const otherPlayerId = 'player2';
    players[otherPlayerId] = {
      id: otherPlayerId,
      name: 'Player 2',
      px: MAZE_WIDTH * CELL - CELL - CELL/2,
      py: MAZE_HEIGHT * CELL - CELL - CELL/2,
      color: '#ff55aa',
      role: 'wall',
      teamId: 0, // Same team as player 1
      score:0, dash:null, trail:[], emoji: roomConfig.gameMode==='coop' ? (1 % 2===0 ? RUNNER_EMOJIS[Math.floor(1/2) % RUNNER_EMOJIS.length] : WALL_EMOJIS_BY_RUNNER_INDEX[Math.floor(1/2) % WALL_EMOJIS_BY_RUNNER_INDEX.length]) : RUNNER_EMOJIS[1 % RUNNER_EMOJIS.length]
    };
  }

  gameStarted = true;
  document.getElementById('game-overlay').style.display = 'none';
  drawGame();
}

function startGame() {
  onGameStart({ gameMode: 'coop' }); // Start in coop mode as per request
}

// Basic movement (for demonstration)
document.addEventListener('keydown', (e) => {
  if (!gameStarted || !myPlayer) return;

  let targetX = myPlayer.px;
  let targetY = myPlayer.py;
  const step = CELL; // Move by one cell

  switch (e.key) {
    case 'ArrowUp':
      targetY -= step;
      break;
    case 'ArrowDown':
      targetY += step;
      break;
    case 'ArrowLeft':
      targetX -= step;
      break;
    case 'ArrowRight':
      targetX += step;
      break;
  }

  const gridX = Math.floor(targetX / CELL);
  const gridY = Math.floor(targetY / CELL);

  if (gridX >= 0 && gridX < MAZE_WIDTH && gridY >= 0 && gridY < MAZE_HEIGHT && maze[gridY][gridX] === 0) {
    myPlayer.px = targetX;
    myPlayer.py = targetY;

    // Check for treasure collection
    treasures.forEach(t => {
      if (!t.collected && gridX === t.x && gridY === t.y) {
        t.collected = true;
        myPlayer.score++;
        document.getElementById('score').innerText = myPlayer.score;
        showMessage('Treasure Collected!');
      }
    });
  }
});

function showMessage(msg) {
  const msgDisplay = document.getElementById('message-display');
  msgDisplay.innerText = msg;
  msgDisplay.style.opacity = 1;
  setTimeout(() => {
    msgDisplay.style.opacity = 0;
  }, 2000);
}

</script>
</body>
</html>
